
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            padding: 30px;
        }


        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid black;
            padding: 15px;
        }

        .logo {
            font-size: 14px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 14px;
        }

        .icone {
            border: 1px solid black;
            width: 35px;
            height: 35px;
        }

        .buscar {
            width: 60%;
            margin: 20px auto;
            display: block;
            padding: 12px;
            border: 1px solid black;
            text-align: center;
        }


        .destaque {
            padding: 25px;
            border-bottom: 1px solid black;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .linha {
            width: 200px;
            border-bottom: 2px solid black;
            margin-bottom: 8px;
        }

        .fotos {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px;
        }

        .imagem {
            width: 160px;
            height: 120px;
            border: 1px solid black;
            position: relative;
        }

        .imagem::before,
        .imagem::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background: black;
            top: 50%;
            left: 0;
        }

        .imagem::before {
            transform: rotate(37deg);
        }

        .imagem::after {
            transform: rotate(-37deg);
        }


        .informacoes {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid black;
            padding: 25px;
        }

        .horarios,
        .localizacao {
            width: 45%;
            padding: 15px;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 15px;
        }

        .local {
            border: 1px solid black;
            padding: 15px;
            display: inline-block;
        }


        .botao {
            display: block;
            width: 180px;
            padding: 15px;
            margin: 25px auto;
            border: 1px solid black;
            text-align: center;
            text-decoration: none;
            color: black;
        }


        .cardapio {
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            padding: 25px;
        }

        .conteudo-cardapio {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .foto-prato {
            width: 75px;
            height: 65px;
            border: 1px solid black;
            position: relative;
        }

        .foto-prato::before,
        .foto-prato::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background: black;
            top: 50%;
        }

        .foto-prato::before {
            transform: rotate(40deg);
        }

        .foto-prato::after {
            transform: rotate(-40deg);
        }

        .descricao {
            flex: 1;
        }

        .descricao p {
            margin-top: 15px;
        }

        .foto-grande {
            width: 100%;
            height: 250px;
            border: 1px solid black;
            position: relative;
        }

        .foto-grande::before,
        .foto-grande::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background: black;
            top: 50%;
        }

        .foto-grande::before {
            transform: rotate(35deg);
        }

        .foto-grande::after {
            transform: rotate(-35deg);
        }


        footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 25px;
            border-top: 1px solid black;
        }

        .contato-linhas {
            width: 90%;
            margin-top: 15px;
        }

        .contato-linhas div {
            border-bottom: 1px solid black;
            margin-bottom: 12px;
        }

        .foto-contato {
            width: 180px;
            height: 110px;
            border: 1px solid black;
            position: relative;
            justify-self: center;
        }

        .foto-contato::before,
        .foto-contato::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background: black;
            top: 50%;
        }

        .foto-contato::before {
            transform: rotate(30deg);
        }

        .foto-contato::after {
            transform: rotate(-30deg);
        }

    </style>
</head>

<body>


    <header>

        <div class="logo">LOGO</div>

        <nav>
            <a href="#inicio">INÍCIO</a>
            <a href="#cardapio">CARDÁPIO</a>
            <a href="#contato">CONTATO</a>
        </nav>

        <div class="icone"></div>

    </header>

    <input
        type="text"
        class="buscar"
        placeholder="BUSCAR"
    >


    <section class="destaque" id="inicio">

        <h1>DESTAQUE</h1>

        <div class="linha"></div>
        <div class="linha"></div>
        <div class="linha"></div>

        <div class="fotos">
            <div class="imagem"></div>
            <div class="imagem"></div>
        </div>

    </section>


    <section class="informacoes">

        <div class="horarios">

            <h2>HORÁRIOS</h2>

            <div class="linha"></div>
            <div class="linha"></div>
            <div class="linha"></div>

        </div>

        <div class="localizacao">

            <h2>LOCALIZAÇÃO</h2>

            <div class="local">📍</div>

        </div>

    </section>


    <a href="#cardapio" class="botao">
        VER CARDÁPIO
    </a>


    <section class="cardapio" id="cardapio">

        <h1>CARDÁPIO</h1>

        <div class="conteudo-cardapio">

            <div>

                <div class="item">

                    <div class="foto-prato"></div>

                    <div class="descricao">
                        <h3>PRATO</h3>
                        <p>PREÇO</p>
                    </div>

                </div>

                <div class="item">

                    <div class="foto-prato"></div>

                    <div class="descricao">
                        <h3>PRATO</h3>
                        <p>PREÇO</p>
                    </div>

                </div>

            </div>

            <div class="foto-grande"></div>

        </div>

    </section>


    <footer id="contato">

        <div>

            <h2>CONTATO</h2>

            <div class="contato-linhas">
                <div></div>
                <div></div>
                <div></div>
            </div>

        </div>

        <div class="foto-contato"></div>

    </footer>

</body>
</html>
